name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Unpack project
        run: unzip -q ./*.zip -d proj

      - name: Build debug APK
        working-directory: proj/TTD_Auto_Macro_Android
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: TTD-Auto-Macro-debug-apk
          path: proj/TTD_Auto_Macro_Android/app/build/outputs/apk/debug/app-debug.apk
